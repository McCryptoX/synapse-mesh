[project]
name = "synapse-mesh"
version = "0.1.0"
description = "Synapse-Mesh (Exocortex): Agent-Native Verified Living Solutions Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "starlette>=0.37.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "packaging>=24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "numpy>=2.0.0",
    "duckdb>=0.10.0"
]

[project.scripts]
synapse = "synapse_cli.main:cli_entrypoint"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "synapse_cli*"]
