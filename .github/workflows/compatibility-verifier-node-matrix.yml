name: Compatibility verifier Node matrix

on:
  pull_request:
    paths:
      - 'packages/verify/**'
      - 'schemas/compatibility_bundle_v1.json'
      - 'bundles/golden/**'
      - '.github/actions/verify-compatibility/**'
      - '.github/workflows/compatibility-verifier-node-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'packages/verify/**'
      - 'schemas/compatibility_bundle_v1.json'
      - 'bundles/golden/**'
      - '.github/actions/verify-compatibility/**'
      - '.github/workflows/compatibility-verifier-node-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-unit-tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate Golden Bundles without executing third-party code
        shell: bash
        run: |
          set -euo pipefail
          for bundle in bundles/golden/*.json; do
            node packages/verify/bin.js "$bundle" \
              --schema schemas/compatibility_bundle_v1.json \
              --validate-only
          done
      - name: Run verifier unit tests
        run: node --test packages/verify/test/*.test.js

  action-httpx-golden-smoke:
    name: Composite action / HTTPX 0.28 Golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - name: Install exact HTTPX dependency closure
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install --disable-pip-version-check --no-deps \
            httpx==0.28.1 \
            httpcore==1.0.9 \
            anyio==4.14.2 \
            certifi==2026.7.22 \
            h11==0.16.0 \
            idna==3.19 \
            typing_extensions==4.12.2
          "$PYTHON" -m pip check
      - id: verify
        uses: ./.github/actions/verify-compatibility
        with:
          bundle: bundles/golden/bundle_httpx_028_asgi_transport.json
          python: ${{ steps.python.outputs.python-path }}
          attestation-path: .artifacts/httpx-028-evidence.json
          upload-artifact: 'false'
      - name: Assert evidence contract
        shell: bash
        env:
          ACTION_VERIFIED: ${{ steps.verify.outputs.verified }}
          ACTION_BUNDLE_SHA: ${{ steps.verify.outputs.bundle-sha256 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const bundle = fs.readFileSync('bundles/golden/bundle_httpx_028_asgi_transport.json');
          const statement = JSON.parse(fs.readFileSync('.artifacts/httpx-028-evidence.json', 'utf8'));
          const expected = crypto.createHash('sha256').update(bundle).digest('hex');
          if (process.env.ACTION_VERIFIED !== 'true') throw new Error('Action did not report verified=true');
          if (process.env.ACTION_BUNDLE_SHA !== expected) throw new Error('Action output digest mismatch');
          if (statement.predicate?.verified !== true || statement.predicate?.validationOnly !== false) {
            throw new Error('Evidence is not a successful execution statement');
          }
          if (statement.subject?.[0]?.digest?.sha256 !== expected) throw new Error('Evidence subject digest mismatch');
          if (/"(?:stdout|stderr)"\s*:/.test(JSON.stringify(statement))) throw new Error('Raw process output leaked');
          NODE
