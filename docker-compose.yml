services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse_api
    restart: unless-stopped
    # SSE sessions are intentionally process-local, so production uses one worker.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    volumes:
      - ./data:/app/data
      - ./bundles/golden:/app/bundles/golden:ro
      - ./bundles/drafts:/app/bundles/drafts
      - ./evidence/runs:/app/evidence/runs:ro
      - ./evidence/lifecycle:/app/evidence/lifecycle:ro
    environment:
      - ENVIRONMENT=production
      - DOMAIN=synapsemesh.dev
      - LOG_LEVEL=WARNING
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - AUTONOMOUS_MINING_ENABLED=true
      - OPS_PASSWORD=${OPS_PASSWORD:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1024m
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
          pids: 128
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    networks:
      - synapse_net

  caddy:
    image: caddy:2-alpine
    container_name: synapse_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
          pids: 128
        reservations:
          memory: 64M
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    depends_on:
      - api
    networks:
      - synapse_net

volumes:
  caddy_data:
  caddy_config:

networks:
  synapse_net:
    driver: bridge
