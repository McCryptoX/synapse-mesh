services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log"]
    volumes:
      - ./data:/app/data
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./synapse_cli:/app/synapse_cli:ro
      - ./bundles:/app/bundles:ro
      - ./benchmark:/app/benchmark:ro
      - ./tests:/app/tests:ro
    environment:
      - ENVIRONMENT=production
      - DOMAIN=synapsemesh.dev
      - LOG_LEVEL=WARNING
      - PYTHONPATH=/app
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    networks:
      - synapse_net

  caddy:
    image: caddy:2-alpine
    container_name: synapse_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    depends_on:
      - api
    networks:
      - synapse_net

volumes:
  caddy_data:
  caddy_config:

networks:
  synapse_net:
    driver: bridge
