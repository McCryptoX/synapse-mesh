<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops Login | Synapse-Mesh</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <style>
        *, ::after, ::before { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 24rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            text-align: center;
        }
        .input-field {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 0.95rem;
            font-family: ui-monospace, monospace;
            margin-top: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .input-field:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.2);
        }
        .btn-submit {
            width: 100%;
            background: #0d9488;
            color: #020617;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #14b8a6;
            font-size: 0.95rem;
            font-family: ui-monospace, monospace;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-submit:hover {
            background: #14b8a6;
            color: #000;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
        }
        .error-msg {
            background: rgba(76, 5, 25, 0.6);
            border: 1px solid rgba(225, 29, 72, 0.5);
            color: #f43f5e;
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            font-family: ui-monospace, monospace;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔒</div>
        <h1 style="font-size: 1.25rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;">Ops Observatory Access</h1>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Authenticate to access the read-only registry and automation telemetry view.</p>

        <form action="/ops/login" method="POST" style="margin-top: 1.5rem;">
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <input type="password" name="password" placeholder="Password or Access Key..." required autofocus class="input-field">
            <button type="submit" class="btn-submit">Unlock Dashboard &rarr;</button>
        </form>
        
        <div style="margin-top: 1.5rem;">
            <a href="/" style="font-size: 0.75rem; color: #64748b; font-family: ui-monospace, monospace; text-decoration: underline;">&larr; Back to Public Registry</a>
        </div>
    </div>
</body>
</html>
